[package]
name = "ecs_benchmarking"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Head-to-head Criterion benchmarks comparing freecs against bevy_ecs"
repository = "https://github.com/matthewjberger/ecs_benchmarking"
publish = false

# freecs and nightshade-ecs both offer a contiguous-byte column backend behind
# an identical public API, and both run with it on so the two columns are
# configured the same way. Neither backend changes observable behavior: change
# detection and the structural-change log are orthogonal to it and stay off on
# both. bevy_ecs and sky_ecs have no equivalent to turn on.
[dependencies]
freecs = { version = "5.1", features = ["dynamic", "raw_storage"] }
nightshade-ecs = { git = "https://github.com/matthewjberger/nightshade", rev = "5a9e1a7c38322d09922da243251f11f1d3971203", features = [
    "raw_storage",
    "parallel",
] }
bevy_ecs = "0.19"
bevy_tasks = "0.19"
sky_ecs = "0.1"
cgmath = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "experiment_parallel"
harness = false

[[bin]]
name = "report"
path = "src/bin/report.rs"

[profile.bench]
lto = "thin"
codegen-units = 1


[patch."https://github.com/matthewjberger/nightshade"]
nightshade-ecs = { path = "../nightshade/crates/nightshade-ecs" }

