[package]
name = "ecs_benchmarking"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Head-to-head Criterion benchmarks comparing freecs against bevy_ecs"
repository = "https://github.com/matthewjberger/ecs_benchmarking"
publish = false

# freecs offers a contiguous-byte column backend behind an identical public
# API, and it runs with that backend on. The backend does not change observable
# behavior: change detection and the structural-change log are orthogonal to it
# and stay off. bevy_ecs and sky_ecs have no equivalent to turn on. hemlock-ecs
# has raw columns in its default features, and they stay on here.
[dependencies]
freecs = { version = "5.1", features = ["dynamic", "raw_storage"] }
hemlock-ecs = { git = "https://github.com/matthewjberger/hemlock", rev = "e4574a6710a7af37c264f95db688e0b468e0fdb0" }
bevy_ecs = "0.20"
bevy_tasks = "0.20"
sky_ecs = "0.3"
cgmath = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "experiment_parallel"
harness = false

[[bin]]
name = "report"
path = "src/bin/report.rs"

[profile.bench]
lto = "thin"
codegen-units = 1
